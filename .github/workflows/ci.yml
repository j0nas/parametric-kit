name: CI

# Two jobs, in that order on purpose.
#
# `verify` runs what a local session runs — nothing here was checked by CI before, so a
# push that broke `vp check` or the geometry probes only surfaced in a consumer's deploy.
#
# `notify` then pokes the consumers. They don't depend on a published version of this kit;
# they check this repo out as a sibling and build it from source in their own deploys, so a
# push here changes nothing on their live sites until each one rebuilds. The matrix below
# is the list of consumers — add a new consumer app's repo there when it starts building
# the kit. Gating it on `verify` is the point of the ordering: telling two apps to redeploy
# from a kit that doesn't compile just spreads the breakage to their live sites.
#
# The poke is a repository_dispatch (`kit-updated`) sent with a fine-grained PAT that has
# Contents: read+write on the consumer repos, stored as the CONSUMER_DISPATCH_TOKEN secret.
# Re-fire manually from the Actions tab (workflow_dispatch) if needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to this repo; the consumer dispatch uses its own PAT, so GITHUB_TOKEN
# never needs more than read.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No `version:` — package.json's `packageManager` field is the single source of
      # truth, and action-setup reads it. devEngines alone is not enough for the action.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # dist/ is gitignored and every consumer builds it themselves before building their
      # app. If `vp pack` breaks, all three deploys break — so prove it packs here, where
      # one red X is cheaper than three broken sites.
      - run: pnpm run build

  notify:
    needs: verify
    # A pull request must not tell live apps to redeploy — only the merged result does.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # One unreachable consumer shouldn't stop the others from being told.
      fail-fast: false
      matrix:
        repo: [j0nas/laser-mtg-deck-box, j0nas/lamp-shade-designer]
    steps:
      - name: Dispatch kit-updated
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          REPO: ${{ matrix.repo }}
        run: |
          if out=$(gh api -X POST "repos/$REPO/dispatches" -f event_type=kit-updated 2>&1); then
            echo "poked $REPO"
            exit 0
          fi
          echo "$out"
          # A bare "403 Resource not accessible" reads like a broken token. It usually
          # isn't: the PAT is fine-grained and its repository access is a list, so a
          # consumer added to the matrix after the token was minted is simply not on it.
          case "$out" in
            *"not accessible"* | *"Not Found"*)
              echo "::error::CONSUMER_DISPATCH_TOKEN cannot dispatch to $REPO." \
                   "Open https://github.com/settings/personal-access-tokens, add $REPO to" \
                   "the token's repository access with Contents: read and write, then re-run" \
                   "this workflow. (A 404 here means the same thing — GitHub hides repos the" \
                   "token can't see.)"
              ;;
          esac
          exit 1
